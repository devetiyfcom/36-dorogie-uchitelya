<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Дорогие учителя</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Manrope:wght@400;600;800&display=swap">
<style>
/* Layout: full-screen vertical story, tap to advance, blurred backdrop behind each picture, closing card with the thank-you message. */
:root{
  --ink:#0f1226; --ink2:#1b1f3d; --paper:#fff7e8; --gold:#ffc94a; --rose:#ff8fa3;
  --script:"Marck Script","Segoe Script",cursive; --ui:"Manrope",system-ui,sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--ui);overflow:hidden;margin:0;padding:0}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;pointer-events:none;display:flex;align-items:center;justify-content:center}
.slide.on{opacity:1}
.bg{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(28px) brightness(.55) saturate(1.2);transform:scale(1.1)}
.pic{position:relative;width:min(100%,calc((100dvh - 120px) * var(--ar)));max-height:calc(100dvh - 120px);aspect-ratio:var(--ar);border-radius:18px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);margin-inline:16px;max-width:calc(100% - 32px)}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.02)}
.slide.on .pic img{animation:kb 6s ease-out forwards}
.slide.alt.on .pic img{animation-name:kb2}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.14) translate(-1.5%,-1%)}}
@keyframes kb2{from{transform:scale(1.14) translate(1.5%,1%)}to{transform:scale(1.02)}}
.bars{position:absolute;top:0;left:0;right:0;display:flex;gap:5px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;z-index:5}
.bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold)}
.bar.done i{width:100%}
.bar.run i{animation:fill var(--d,5.5s) linear forwards}
@keyframes fill{to{width:100%}}
.tap{position:absolute;top:0;bottom:0;z-index:4;width:38%}
.tap.l{left:0}.tap.r{right:0;width:62%}
.mute{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:6;border:1px solid rgba(255,255,255,.35);background:rgba(15,18,38,.55);color:var(--paper);font:600 13px var(--ui);padding:9px 14px;border-radius:99px;cursor:pointer}
.mute:focus-visible,.go:focus-visible,.again:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.chap{position:absolute;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:5;font:600 12px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:rgba(255,247,232,.7)}
/* intro + outro */
.card{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:32px 24px;background:radial-gradient(120% 90% at 50% 20%,#2a2f66 0%,var(--ink) 70%);transition:opacity .8s}
.card[hidden]{display:none!important}
.card h1{font:400 clamp(44px,12vw,92px)/1.02 var(--script);margin:0;color:var(--gold);text-wrap:balance}
.card p.sub{margin:0;max-width:30ch;font-size:17px;line-height:1.5;color:rgba(255,247,232,.82)}
.go,.again{margin-top:10px;border:0;border-radius:99px;background:var(--gold);color:var(--ink);font:800 16px var(--ui);padding:15px 34px;cursor:pointer;box-shadow:0 10px 30px rgba(255,201,74,.35)}
.again{background:transparent;color:var(--paper);border:1px solid rgba(255,255,255,.4);box-shadow:none;font-weight:600;padding:11px 24px;margin-top:6px}
.msg{font:400 clamp(26px,6.4vw,46px)/1.28 var(--script);max-width:20em;margin:0;color:var(--paper);text-wrap:pretty}
.msg span{opacity:0;display:inline-block;transform:translateY(10px);transition:opacity .7s,transform .7s}
.msg span.in{opacity:1;transform:none}
.fin{font:400 clamp(40px,11vw,76px)/1 var(--script);color:var(--rose);margin:0;opacity:0;transition:opacity 1s}
.fin.in{opacity:1}
canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.card>*:not(canvas){position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.slide.on .pic img{animation:none}.msg span{transition:none}}

/* intro scene: green chalkboard in a wooden frame, eraser wipes old scribbles, title is chalked in */
#intro{--chalk:#f3f1e7;--chalky:#ffd86b;overflow:hidden;clip-path:circle(150% at 50% 78%);transition:clip-path 1.25s cubic-bezier(.7,0,.25,1);
  background:radial-gradient(90% 60% at 30% 20%,rgba(255,255,255,.07),transparent 60%),radial-gradient(70% 50% at 75% 80%,rgba(255,255,255,.05),transparent 60%),linear-gradient(160deg,#25473c 0%,#1a342c 60%,#16302a 100%);
  box-shadow:inset 0 0 0 12px #8a5a34,inset 0 0 0 14px #5e3a1d,inset 0 0 60px 18px rgba(0,0,0,.45)}
#intro.open{clip-path:circle(0% at 50% 78%)}
#intro{padding:40px 24px 84px;gap:14px}
#intro>.tray,#intro>.eraser,#intro>.scrib{position:absolute}
#intro>.tray{left:14px;right:14px;bottom:14px;top:auto}
.scrib{position:absolute;inset:0;z-index:0;pointer-events:none;color:rgba(243,241,231,.3);clip-path:inset(0 0 0 0);animation:erase 4s .5s cubic-bezier(.45,0,.55,1) forwards;filter:url(#chalk)}
.scrib span{position:absolute;font:400 28px var(--script);transform:rotate(var(--r,0deg))}
.scrib span.b{font-size:58px}
@keyframes erase{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 105%)}}
.eraser{position:absolute;top:34%;left:-120px;width:104px;height:52px;z-index:2;pointer-events:none;animation:sweep 4s .5s cubic-bezier(.45,0,.55,1) forwards,bob .5s .5s 8 alternate ease-in-out;opacity:.96}
.eraser i{position:absolute;inset:0;border-radius:6px;background:linear-gradient(#b9a98a 0 38%,#3b3a37 38%);box-shadow:0 8px 14px rgba(0,0,0,.45)}
@keyframes sweep{from{left:-120px;opacity:1}to{left:calc(105% + 10px);opacity:1}}
@keyframes bob{from{margin-top:-60px;transform:rotate(-4deg)}to{margin-top:60px;transform:rotate(5deg)}}
#intro .date{margin:0;font:600 13px var(--ui);letter-spacing:.2em;text-transform:uppercase;color:rgba(243,241,231,.8);opacity:0;animation:up .8s 4.3s forwards}
.title{display:flex;flex-direction:column;margin:0;line-height:.98;font:400 clamp(58px,17vw,120px)/.98 var(--script);color:var(--chalk);filter:url(#chalk)}
.title .w{display:block;clip-path:inset(0 100% 0 0);animation:wipe 1s cubic-bezier(.6,0,.2,1) forwards;padding:0 .1em;text-shadow:0 0 14px rgba(243,241,231,.25)}
.title .w1{animation-delay:4.5s}.title .w2{animation-delay:5.2s;color:var(--chalky)}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.under{margin-top:-6px;filter:url(#chalk)}
.under path{stroke-dasharray:320;stroke-dashoffset:320;animation:draw 1s 6.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#intro p.sub.type{min-height:3.9em;font:400 clamp(32px,8.2vw,46px)/1.25 var(--script);max-width:18em;color:rgba(243,241,231,.92);filter:url(#chalk)}
.sub.type::after{content:"";display:inline-block;width:3px;height:.9em;margin-left:3px;background:var(--chalky);vertical-align:-2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bell{position:relative;width:62px;height:62px;border-radius:50%;border:0;background:var(--chalky);color:#1a342c;display:grid;place-items:center;cursor:pointer;margin-top:12px;opacity:0;animation:up .8s 7.3s forwards;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.bell::before,.bell::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px dashed var(--chalky);animation:ring 2.2s 8s infinite ease-out;opacity:0}
.bell::after{animation-delay:8.7s}
@keyframes ring{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.9);opacity:0}}
.bell svg{width:28px;height:28px;transform-origin:50% 12%;animation:swing 2.2s 8.2s infinite}
@keyframes swing{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(16deg)}20%{transform:rotate(-14deg)}30%{transform:rotate(10deg)}40%{transform:rotate(-7deg)}50%{transform:rotate(3deg)}}
.bell.rung svg{animation:swing .5s 4 linear}
.bell:focus-visible{outline:3px solid var(--chalk);outline-offset:5px}
.cta{margin:0;font:600 14px var(--ui);letter-spacing:.12em;text-transform:uppercase;color:rgba(243,241,231,.9);opacity:0;animation:up .8s 7.5s forwards}
.tray{position:absolute;left:14px;right:14px;bottom:14px;height:16px;background:linear-gradient(#a8744a,#7a4e2b);border-top:2px solid #c99a6b;box-shadow:0 -4px 10px rgba(0,0,0,.3)}
.ch{position:absolute;top:-9px;height:9px;border-radius:3px 3px 1px 1px}
.c1{left:18%;width:44px;background:#f3f1e7}.c2{left:calc(18% + 58px);width:30px;background:#ffd86b;transform:rotate(-3deg)}.c3{right:12%;width:38px;background:#ff9fb2}
@media (prefers-reduced-motion:reduce){.scrib,.eraser{animation:none}.scrib{opacity:0}.eraser{display:none}.title .w,.under path,.bell,.cta,#intro .date{animation:none;opacity:1;clip-path:none;stroke-dashoffset:0}.bell::before,.bell::after,.bell svg{animation:none}}
</style>

<div class="stage" id="stage">
  <div class="bars" id="bars"></div>
  <div id="slides"></div>
  <div class="tap l" id="prev"></div><div class="tap r" id="next"></div>
  <div class="chap" id="chap"></div>
  <button class="mute" id="mute" type="button" hidden>Звук: вкл</button>

  <section class="card" id="intro">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="chalk"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/></filter></svg>
    <div class="scrib" aria-hidden="true">
      <span style="left:6%;top:10%;--r:-6deg">2 + 2 = 4</span>
      <span style="right:8%;top:8%;--r:5deg">E = mc²</span>
      <span style="left:8%;top:68%;--r:4deg">а² + b² = c²</span>
      <span style="right:7%;top:62%;--r:-5deg">H₂O</span>
      <span class="b" style="left:40%;top:6%;--r:3deg">π</span>
      <span class="b" style="left:4%;top:38%;--r:-3deg">∑</span>
      <span class="b" style="right:6%;top:36%;--r:4deg">А Б В</span>
      <span style="left:34%;top:78%;--r:-2deg">1 · 2 · 3 · 4 · 5</span>
    </div>
    <div class="eraser" aria-hidden="true"><i></i></div>
    <p class="date">5 октября · День учителя</p>
    <h1 class="title"><span class="w w1">Дорогие</span><span class="w w2">учителя</span></h1>
    <svg class="under" width="280" height="20" viewBox="0 0 280 20" fill="none" aria-hidden="true"><path d="M4 12c44-10 88 6 134-2s90-4 138 0" stroke="#ffd86b" stroke-width="3.2" stroke-linecap="round"/></svg>
    <p class="sub type" id="typed" data-text="Эта история о том, с чего начинается каждая большая мечта…"></p>
    <button class="bell" id="go" type="button" aria-label="Позвонить в звонок и начать">
      <svg width="40" height="40" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M32 6c-2 0-3 1-3 3v1C21 12 16 19 16 27v10l-6 8c-1 1 0 3 2 3h40c2 0 3-2 2-3l-6-8V27c0-8-5-15-13-17V9c0-2-1-3-3-3zM26 52a6 6 0 0 0 12 0z"/></svg>
    </button>
    <p class="cta">Позвонить в звонок</p>
    <div class="tray" aria-hidden="true"><b class="ch c1"></b><b class="ch c2"></b><b class="ch c3"></b></div>
  </section>

  <section class="card" id="outro" hidden>
    <canvas id="fx"></canvas>
    <p class="msg" id="msg">Дорогие учителя, мы искренне благодарны вам за ваше терпение, доброту и огромный труд, вложенный в каждого из нас — с праздником вас!</p>
    <p class="fin" id="fin">С праздником!</p>
    <button class="again" id="again" type="button">Смотреть ещё раз</button>
  </section>
</div>

  var CH=["Первый класс","Мечты","Трудный путь","Упорство","Успех","Благодарность"];
  var DUR=5500, cur=-1, timer=null, started=false;
  var slidesEl=document.getElementById('slides'), barsEl=document.getElementById('bars'), chap=document.getElementById('chap');
  var intro=document.getElementById('intro'), outro=document.getElementById('outro'), muteBtn=document.getElementById('mute');
  IMGS.forEach(function(o,i){
    var s=document.createElement('div'); s.className='slide'+(i%2?' alt':'');
    s.innerHTML='<div class="bg" style="background-image:url('+o.src+')"></div><div class="pic" style="--ar:'+o.ar+'"><img alt="" src="'+o.src+'"></div>';
    slidesEl.appendChild(s);
    var b=document.createElement('div'); b.className='bar'; b.innerHTML='<i></i>'; b.style.setProperty('--d',(DUR/1000)+'s'); barsEl.appendChild(b);
  });
  var fb=document.createElement('div'); fb.className='bar'; fb.innerHTML='<i></i>'; barsEl.appendChild(fb);
  var slides=[].slice.call(slidesEl.children), bars=[].slice.call(barsEl.children);

  function show(n){
    clearTimeout(timer);
    if(n<0) n=0;
    cur=n;
    bars.forEach(function(b,i){b.classList.remove('run');b.classList.toggle('done',i<n); void b.offsetWidth;});
    if(n>=slides.length){
      slides.forEach(function(s){s.classList.remove('on')});
      chap.textContent=''; bars[bars.length-1].classList.add('done');
      outro.hidden=false; outro.style.opacity=0; requestAnimationFrame(function(){outro.style.opacity=1});
      reveal(); fx(); return;
    }
    outro.hidden=true; stopFx();
    slides.forEach(function(s,i){s.classList.toggle('on',i===n)});
    chap.textContent=CH[n]||''; bars[n].classList.add('run');
    timer=setTimeout(function(){show(n+1)},DUR);
  }
  function reveal(){
    var m=document.getElementById('msg'), fin=document.getElementById('fin');
    if(!m.dataset.split){
      var words=m.textContent.trim().split(/\s+/); m.textContent='';
      words.forEach(function(w,i){var sp=document.createElement('span'); sp.textContent=w+(i<words.length-1?' ':''); m.appendChild(sp)});
      m.dataset.split='1';
    }
    var sp=[].slice.call(m.children); fin.classList.remove('in'); sp.forEach(function(s){s.classList.remove('in')});
    sp.forEach(function(s,i){setTimeout(function(){ if(!outro.hidden) s.classList.add('in')}, 400+i*230)});
    setTimeout(function(){ if(!outro.hidden) fin.classList.add('in')}, 600+sp.length*230);
  }
  document.getElementById('next').onclick=function(){ if(cur<slides.length) show(cur+1) };
  document.getElementById('prev').onclick=function(){ if(cur<=slides.length) show(cur-1) };
  document.getElementById('again').onclick=function(){ show(0) };
  /* typewriter in the intro */
  (function(){
    var el=document.getElementById('typed'), txt=el.getAttribute('data-text'), i=0;
    setTimeout(function(){ var iv=setInterval(function(){ el.textContent=txt.slice(0,++i); if(i>=txt.length) clearInterval(iv) },38) },6400);
  })();
  function bellSound(){
    try{
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      ac=ac||new AC(); if(ac.state==='suspended') ac.resume();
      var base=[0,.42,.84,1.26,1.68,2.1];
      base.forEach(function(d){
        var t=ac.currentTime+d;
        [[1,.22],[2.76,.11],[5.4,.06]].forEach(function(p){
          var o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=1046*p[0];
          g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(p[1],t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+1.1);
          o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.2);
        });
      });
    }catch(e){}
  }
  document.getElementById('go').onclick=function(){
    var b=this; if(started) return; started=true;
    b.classList.add('rung'); bellSound();
    setTimeout(function(){
      intro.classList.add('open'); muteBtn.hidden=false; music(); show(0);
      setTimeout(function(){intro.hidden=true},1300);
    },1500);
  };

  /* background music (embedded mp3) */
  var ac=null, on=true, bgm=null;
  function music(){
    try{
      if(!bgm){ bgm=new Audio('dorogie-uchitelya.mp3'); bgm.loop=true; bgm.volume=0; }
      if(!on) return;
      var p=bgm.play(); if(p&&p.catch) p.catch(function(){});
      var iv=setInterval(function(){ if(bgm.volume>=.72){clearInterval(iv);return} bgm.volume=Math.min(.75,bgm.volume+.03) },120);
    }catch(e){}
  }
  muteBtn.onclick=function(){
    on=!on; muteBtn.textContent='Звук: '+(on?'вкл':'выкл');
    if(bgm){ if(on){ bgm.volume=.7; var p=bgm.play(); if(p&&p.catch) p.catch(function(){}) } else bgm.pause(); }
  };

  /* falling petals on closing card */
  var raf=null;
  function stopFx(){ cancelAnimationFrame(raf); raf=null }
  function fx(){
    if(raf) return;
    var c=document.getElementById('fx'), x=c.getContext('2d'), W,H,ps=[];
    function size(){ var r=c.getBoundingClientRect(); W=c.width=r.width*devicePixelRatio; H=c.height=r.height*devicePixelRatio }
    size();
    var cols=['#ffc94a','#ff8fa3','#fff7e8','#ffb36b'];
    for(var i=0;i<46;i++) ps.push({x:Math.random()*W,y:Math.random()*H,r:(4+Math.random()*7)*devicePixelRatio,v:(.4+Math.random()*1.1)*devicePixelRatio,w:Math.random()*6,c:cols[i%4]});
    function draw(){
      x.clearRect(0,0,W,H);
      ps.forEach(function(p){
        p.y+=p.v; p.w+=.02; p.x+=Math.sin(p.w)*.6*devicePixelRatio;
        if(p.y>H+10){p.y=-10;p.x=Math.random()*W}
        x.save(); x.translate(p.x,p.y); x.rotate(p.w); x.fillStyle=p.c; x.globalAlpha=.75;
        x.beginPath(); x.ellipse(0,0,p.r,p.r*.55,0,0,6.283); x.fill(); x.restore();
      });
      raf=requestAnimationFrame(draw);
    }
    draw();
  }
})();
